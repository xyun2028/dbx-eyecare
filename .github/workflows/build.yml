# 多平台构建。
#
# 官方 CLI 只允许在目标平台上打包（拿别的 target 会直接拒绝），
# 所以每个平台各占一个 job，产物按 target 分别上传。
# 这里只构建和测试，不自动发 Release —— 发版仍然手动，避免手滑覆盖已发布的版本。

name: 多平台构建

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            target: windows-x64
          - label: macOS x64
            runner: macos-13
            target: darwin-x64
          - label: macOS arm64
            runner: macos-14
            target: darwin-arm64
          - label: Linux x64
            runner: ubuntu-22.04
            target: linux-x64
          # GitHub 的 arm64 runner，公开仓库可用
          - label: Linux arm64
            runner: ubuntu-24.04-arm
            target: linux-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 单元测试
        run: cargo test --manifest-path backend/Cargo.toml

      - name: 装官方打包 CLI
        run: npm install --global @dbx-app/plugin-cli

      # 不传 --target：CLI 取当前主机，和上面矩阵里的 target 是同一个
      - name: 打包
        run: node scripts/package.js

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.dbxp
            dist/*.artifact.json
          if-no-files-found: error

  # 五个平台都打完之后，合成一份完整的上架材料。
  # 官方 CLI 不允许跨平台打包，所以「一次出全」只能这么做。
  merge:
    name: 合并上架材料
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 合成
        run: node scripts/merge-artifacts.js

      - name: 上传上架材料
        uses: actions/upload-artifact@v4
        with:
          name: listing
          path: |
            dist/*.dbxp
            dist/*.artifact.json
            dist/release-candidates.json
            dist/candidates/**
            dist/publishers/**
          if-no-files-found: error
