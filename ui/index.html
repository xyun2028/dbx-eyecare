<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eye眼</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="banner" class="banner hidden">
      <span class="banner-title">该抬头看看远处了</span>
      <span id="bannerCount" class="banner-count">20</span>
      <button id="bannerClose" class="banner-btn">知道了</button>
    </div>

    <header class="head">
      <div class="brand">
        <img class="mark" src="icon.png" alt="" />
        <div>
          <div class="title-row">
            <h1>Eye眼</h1>
            <span id="mode" class="pill">手动</span>
          </div>
          <p id="sub" class="sub">正在连接…</p>
        </div>
      </div>
      <label class="switch">
        <input id="enabled" type="checkbox" />
        <span class="slider"></span>
      </label>
    </header>

    <main class="body">
      <section class="col">
        <div class="card hero">
          <div class="hero-head">
            <span class="label">色温</span>
            <span class="big"><span id="kelvinNum">4500</span><i>K</i></span>
          </div>
          <input id="kelvin" class="range-temp" type="range" min="1000" max="6500" step="50" />
          <div class="scale"><span>1000 · 暖</span><span>6500 · 中性</span></div>

          <div class="divider"></div>

          <div class="row">
            <label for="brightness">亮度</label>
            <input id="brightness" class="range-dim" type="range" min="10" max="100" step="1" />
            <span id="brightnessVal" class="val">100%</span>
          </div>
        </div>

        <div class="card">
          <div class="card-head"><h2>预设</h2></div>
          <div id="presets" class="presets"></div>
        </div>
      </section>

      <section class="col">
        <div class="card">
          <div class="card-head">
            <h2>按时间自动</h2>
            <label class="switch">
              <input id="auto" type="checkbox" />
              <span class="slider"></span>
            </label>
          </div>
          <div class="row">
            <span class="dot day"></span>
            <span class="row-label">白天</span>
            <input id="dayStart" type="time" />
            <input id="dayK" class="num" type="number" min="1000" max="6500" step="100" />
            <span class="unit">K</span>
          </div>
          <div class="row">
            <span class="dot night"></span>
            <span class="row-label">夜间</span>
            <input id="nightStart" type="time" />
            <input id="nightK" class="num" type="number" min="1000" max="6500" step="100" />
            <span class="unit">K</span>
          </div>
          <p class="hint">
            切换前后 <input id="transition" class="num small" type="number" min="0" max="180" step="10" /> 分钟内过渡
          </p>
        </div>

        <div class="card">
          <div class="card-head">
            <h2>20-20-20</h2>
            <label class="switch">
              <input id="breakOn" type="checkbox" />
              <span class="slider"></span>
            </label>
          </div>
          <div class="clock">
            <span id="breakTime" class="clock-num">20:00</span>
            <span class="clock-cap">后提醒休息</span>
          </div>
          <div class="bar"><div id="breakBar" class="bar-fill"></div></div>
          <div class="row compact">
            <label for="workMinutes">间隔</label>
            <input id="workMinutes" class="num" type="number" min="1" max="180" step="1" />
            <span class="unit">分钟</span>
            <button id="skip" class="ghost">跳过这次</button>
          </div>
        </div>
      </section>
    </main>

    <footer class="foot">
      <span id="hostMode" class="tag">连接中</span>
      <span>每 20 分钟看 20 英尺外 20 秒</span>
    </footer>

    <script type="module" src="app.js"></script>
  </body>
</html>
