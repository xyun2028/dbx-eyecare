<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eye眼</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="banner" class="banner hidden">
      <span class="banner-title">该抬头看看远处了</span>
      <span id="bannerCount" class="banner-count">20</span>
      <button id="bannerClose" class="banner-btn">知道了</button>
    </div>

    <header class="head">
      <div class="brand">
        <img class="mark" src="icon.png" alt="" />
        <div>
          <div class="title-row">
            <h1>Eye眼</h1>
            <span id="mode" class="pill">手动</span>
          </div>
          <p id="sub" class="sub">正在连接…</p>
        </div>
      </div>
      <button id="enabled" class="switch" role="switch" aria-checked="false" title="开关护眼">
        <span class="knob"></span>
      </button>
    </header>

    <p id="supportNote" class="note blocked hidden"></p>
    <p id="hdrNote" class="note hidden"></p>

    <main class="grid">
      <!-- ------------------------------------------------------------ 手动控制 -->
      <section class="card control">
        <div class="hero-head">
          <span class="label">色温</span>
          <span class="big" id="heroValue"><span id="kelvinNum">4500</span><i>K</i></span>
        </div>
        <input id="kelvin" class="range-temp" type="range" min="1000" max="6500" step="50" />
        <div class="scale"><span>1000 · 暖</span><span>6500 · 中性</span></div>

        <div class="divider"></div>

        <div class="row">
          <label for="target">应用到</label>
          <select id="target"></select>
        </div>

        <div class="row">
          <label for="color">颜色</label>
          <input id="color" type="color" value="#c7edcc" />
          <span class="muted">取色即生效，会切到自定义</span>
        </div>

        <div class="row">
          <label for="brightness">亮度</label>
          <input id="brightness" class="range-dim" type="range" min="10" max="100" step="1" />
          <span id="brightnessVal" class="val">100%</span>
        </div>
      </section>

      <!-- -------------------------------------------------------------- 预设 -->
      <section class="card presets-card">
        <div class="card-head">
          <h2>预设</h2>
          <button id="savePreset" class="ghost compact">存为预设</button>
        </div>
        <div id="presetForm" class="preset-form hidden">
          <input id="presetName" type="text" maxlength="24" placeholder="给这套配色起个名字" />
          <button id="presetConfirm" class="ghost">保存</button>
        </div>
        <div id="presets" class="presets"></div>
      </section>

      <!-- ---------------------------------------------------------- 20-20-20 -->
      <section class="card break-card">
        <div class="card-head">
          <h2>20-20-20</h2>
          <button id="breakOn" class="switch" role="switch" aria-checked="false" title="休息提醒">
            <span class="knob"></span>
          </button>
        </div>
        <div class="clock">
          <span id="breakTime" class="clock-num">20:00</span>
          <span id="breakCap" class="clock-cap">后提醒休息</span>
        </div>
        <div class="bar"><div id="breakBar" class="bar-fill"></div></div>
        <div class="row compact">
          <label for="workMinutes">间隔</label>
          <input id="workMinutes" class="num" type="number" min="1" max="180" step="1" />
          <span class="unit">分钟</span>
          <button id="skip" class="ghost">跳过这次</button>
        </div>
        <div class="row compact">
          <label class="row-label grow">休息时调暗</label>
          <button id="dimScreen" class="switch" role="switch" aria-checked="true" title="休息时把屏幕调暖压暗">
            <span class="knob"></span>
          </button>
        </div>
        <p class="hint tight">到点时屏幕短暂变暖变暗，不打开面板也能察觉</p>
      </section>

      <!-- ------------------------------------------------------------ 曲线 -->
      <section class="card curve-card">
        <div class="card-head">
          <h2>24 小时曲线</h2>
          <div class="head-tools">
            <div class="seg" id="modeSeg">
              <button type="button" data-mode="clock">钟点</button>
              <button type="button" data-mode="sun">日出日落</button>
            </div>
            <button id="auto" class="switch" role="switch" aria-checked="false" title="按时间自动">
              <span class="knob"></span>
            </button>
          </div>
        </div>

        <div class="curve-wrap">
          <svg id="curve" viewBox="0 0 720 132" preserveAspectRatio="xMidYMid meet">
            <g id="curveGrid"></g>
            <path id="curveArea" class="curve-area" d="" />
            <path id="curveLine" class="curve-line" d="" />
            <g id="curveMarks"></g>
            <line id="curveNow" class="curve-now" x1="0" y1="14" x2="0" y2="116" />
            <g id="curveDots"></g>
          </svg>
        </div>

        <div class="curve-foot">
          <div class="seg small" id="daySeg">
            <button type="button" data-day="weekday">工作日</button>
            <button type="button" data-day="weekend">周末</button>
          </div>
          <span id="dayNote" class="muted"></span>
          <label class="hint right">
            过渡
            <input id="transition" class="num small" type="number" min="0" max="180" step="10" />
            分钟
          </label>
        </div>

        <div class="anchor-bar">
          <span class="row-label">选中</span>
          <input id="anchorTime" type="time" />
          <input id="anchorK" class="num" type="number" min="1000" max="6500" step="50" />
          <span class="unit">K</span>
          <span id="anchorHint" class="muted">点曲线上的圆点选中，拖动可改时间和色温</span>
        </div>
      </section>

      <!-- ------------------------------------------------------------ 用眼 -->
      <section class="card stats-card">
        <div class="card-head">
          <h2>用眼</h2>
          <span id="streakPill" class="pill off">未开始</span>
        </div>
        <p class="stats-big">
          <span id="todayHours">0</span><i>小时</i><span id="todayMins">0</span><i>分</i>
        </p>
        <p id="todayMeta" class="muted">今天还没有记录</p>
        <div id="weekBars" class="week-bars"></div>
        <p class="muted week-cap">最近七天</p>
      </section>
    </main>

    <footer class="foot">
      <span id="hostMode" class="tag">连接中</span>
      <span>调的是显示器 Gamma 表，不盖遮罩；开了 HDR 的屏幕不生效</span>
    </footer>

    <script type="module" src="app.js"></script>
  </body>
</html>
