# DBX 插件构建配置
#
# 字段以官方 CLI（@dbx-app/plugin-cli）为准，由它负责：
#   编译 backend/ 的 Rust 侧车 → 放进 bin/<target>/ → 写 manifest 的 executable →
#   生成 checksums.json → 按 Unix 权限位打 .dbxp
#
# 所以这里不要再手写 include 里的 manifest.json 和 bin/，CLI 自己会加。

schema_version = 1

[backend]
language = "rust"
directory = "backend"
binary = "eyecare-sidecar"

[package]
include = ["ui"]
